  { q: "जे दोलन तरंग प्रसरणाच्या दिशेने लंबवत असतात, त्यास काय म्हणतात?", options: ["अनुतरंग", "अवतरंग", "तरंगलांबी", "तरंगकाल"], answer: 1 },
  { q: "जलद्वेष हे कोणत्या रोगाचे महत्त्वाचे लक्षण आहे?", options: ["डेंग्यू", "स्वाइन फ्लू", "रेबीज", "हृदयविकार"], answer: 2 },
  { q: "समस्थानिकांमध्ये काय असते?", options: ["न्यूट्रॉनची संख्या समान, परंतु प्रोटॉनची संख्या भिन्न", "प्रोटॉनची संख्या समान, परंतु न्यूट्रॉनची संख्या भिन्न", "प्रोटॉनची संख्या समान, परंतु इलेक्ट्रॉनची संख्या भिन्न", "प्रोटॉन आणि न्यूट्रॉनची संख्या समान"], answer: 1 }
];
/* ===== QUESTIONS END ===== */

const box = document.getElementById("box");
let order, index, score;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(questions);
  index = 0;
  score = 0;
  show();
}

function show() {
  const item = order[index];
  box.innerHTML = "";

  const p = document.createElement("div");
  p.className = "progress";
  p.textContent = "प्रश्न " + (index + 1) + " / " + order.length + "   |   स्कोअर: " + score;
  box.appendChild(p);

  const q = document.createElement("div");
  q.className = "question";
  q.textContent = item.q;
  box.appendChild(q);

  const buttons = [];
  item.options.forEach(function (text, i) {
    const b = document.createElement("button");
    b.className = "option";
    b.textContent = text;
    b.onclick = function () { choose(i, buttons, item); };
    buttons.push(b);
    box.appendChild(b);
  });

  const next = document.createElement("button");
  next.id = "next";
  next.textContent = index + 1 === order.length ? "निकाल पहा" : "पुढचा प्रश्न";
  next.onclick = function () {
    index++;
    if (index < order.length) show(); else finish();
  };
  box.appendChild(next);
}

function choose(i, buttons, item) {
  buttons.forEach(function (b) { b.disabled = true; });
  if (i === item.answer) {
    score++;
    buttons[i].classList.add("correct");
  } else {
    buttons[i].classList.add("wrong");
    buttons[item.answer].classList.add("correct");
  }
  document.getElementById("next").style.display = "inline-block";
}

function finish() {
  const percent = Math.round((score / order.length) * 100);
  box.innerHTML = "";
  const s = document.createElement("div");
  s.className = "score";
  s.textContent = "तुमचा स्कोअर: " + score + " / " + order.length + " (" + percent + "%)";
  box.appendChild(s);
  const r = document.createElement("button");
  r.id = "restart";
  r.textContent = "पुन्हा सराव करा";
  r.onclick = start;
  box.appendChild(r);
}

start();
</script>
</body>
</html>
