<!DOCTYPE html>
<html lang="mr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>टोपणनावे व मूळ नावे – सराव क्विझ | लक्ष्यदीप करिअर अकॅडमी</title>
<style>
:root{--b:#0b5a82;--g:#e0a21b;--bg:#f2f6fa;--ok:#2e7d32;--bad:#c62828}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Noto Sans Devanagari',system-ui,sans-serif;background:var(--bg);color:#16212e}
.head{background:#fff;text-align:center;padding:14px 10px 0;border-bottom:5px solid var(--g)}
.head .logo{display:block;margin:0 auto;width:auto;height:150px;max-width:90%;object-fit:contain}
.head h1{margin:0;color:var(--b);font-size:26px;line-height:1.3}
.team{display:flex;margin-top:10px;padding-bottom:12px;font-size:13px;font-weight:700}
.team div{flex:1;padding:0 4px;border-right:2px solid var(--g)}.team div:last-child{border:0}
.team small{display:block;color:var(--g);font-size:13px}
.bar{background:var(--b);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;position:sticky;top:0;z-index:5}
.bar .t{font-size:24px;font-weight:800}.bar .c{font-size:19px;font-weight:700}
.bar button{background:#ffffff22;border:1.5px solid #ffffff88;color:#fff;border-radius:10px;padding:9px 14px;font-size:15px;font-weight:700;font-family:inherit}
.pg{height:6px;background:#cfe0ea}.pg i{display:block;height:100%;width:0;background:var(--g);transition:.3s}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 30px}
.card{background:#fff;border:1.5px solid #dbe4ec;border-radius:20px;padding:20px 18px;box-shadow:0 3px 12px #0b5a8212}
.qn{color:var(--b);font-weight:800;font-size:18px;margin-bottom:6px}
.qt{font-size:20px;font-weight:700;line-height:1.55;margin-bottom:16px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-family:inherit;font-size:18px;padding:14px;margin-bottom:12px;background:#fff;border:2.5px solid #cfdde8;border-radius:14px}
.opt i{flex:none;width:38px;height:38px;border-radius:50%;background:#eaf1f6;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:17px;color:#16212e}
.opt.sel{border-color:var(--b);background:#e6f2f9}.opt.sel i{background:var(--b);color:#fff}
.nav{display:flex;gap:12px;margin-top:16px}
.btn{flex:1;padding:15px;border-radius:14px;font-family:inherit;font-size:19px;font-weight:800;border:2.5px solid var(--b);background:var(--b);color:#fff}
.btn.o{background:#fff;color:var(--b)}.btn.s{background:var(--ok);border-color:var(--ok)}.btn[disabled]{opacity:.4}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-height:80vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:12px 0}
.grid button{aspect-ratio:1;border-radius:10px;border:2px solid #cfdde8;background:#f2f6fa;font-family:inherit;font-weight:800;font-size:15px}
.grid .a{background:var(--b);color:#fff;border-color:var(--b)}.grid .cur{outline:3px solid var(--g)}
.lg{font-size:13px;color:#556}
.hero{background:linear-gradient(135deg,var(--b),#0e7bb0);color:#fff;border-radius:22px;padding:22px 16px;text-align:center}
.ring{width:150px;height:150px;border-radius:50%;margin:10px auto;display:grid;place-items:center}
.ring div{width:118px;height:118px;border-radius:50%;background:#fff;color:var(--b);display:grid;place-items:center;align-content:center;font-size:34px;font-weight:800;line-height:1.1}
.ring small{display:block;font-size:14px;color:#556;font-weight:700}
.badge{display:inline-block;margin-top:6px;padding:9px 22px;border-radius:30px;font-size:22px;font-weight:800;background:#fff}
.msg{margin-top:10px;font-size:15px;opacity:.95}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats div{background:#fff;border-radius:14px;padding:12px 4px;text-align:center;font-size:13px;font-weight:700;border:1.5px solid #dbe4ec}
.stats b{display:block;font-size:26px}
h3{color:var(--b);margin:22px 0 8px;font-size:19px}
.wq{background:#fff;border-radius:14px;border-left:6px solid var(--bad);padding:12px 14px;margin-bottom:10px;font-size:16px;line-height:1.55;box-shadow:0 2px 8px #0001}
.wq.un{border-color:var(--g)}.wq .y{color:var(--bad);font-weight:700}.wq .r{color:var(--ok);font-weight:800}
.st h2{margin:0 0 4px;color:var(--b);font-size:24px;line-height:1.4;text-align:center}
.st p{margin:0 0 14px;text-align:center;color:#556;font-size:14px}
.st label{display:block;font-weight:800;font-size:15px;margin:12px 0 5px;color:#16212e}
.st input{width:100%;font-family:inherit;font-size:18px;padding:13px;border:2.5px solid #cfdde8;border-radius:12px;background:#fff}
.st input:focus{outline:none;border-color:var(--b)}
.err{color:var(--bad);font-weight:700;font-size:14px;margin-top:10px;min-height:18px}
.note{font-size:12px;color:#7d8a99;margin-top:10px;text-align:center}
.lb{background:#fff;border-radius:18px;border:1.5px solid #dbe4ec;overflow:hidden;margin-top:6px}
.lr{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #eef2f6;font-size:16px}
.lr:last-child{border:0}.lr .k{width:34px;font-weight:800;color:var(--b);text-align:center;font-size:18px}
.lr .n{flex:1;font-weight:700;word-break:break-word}.lr .s{font-weight:800;color:var(--ok)}.lr small{display:block;color:#7d8a99;font-weight:400;font-size:12px}
.lr.me{background:#fff6dd}.lr.t1{background:#fff9e6}
.foot{text-align:center;font-size:12px;color:#aab4be;padding:6px 10px 24px;font-weight:400}
</style></head><body>
